[platformio]
default_envs = esp32c5_4mb
boards_dir = boards

[env]
platform = espressif32@7.0.1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = release
board_build.cmake_extra_args =
    -DBC250_VERSION=0.1.0
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DBC250_VERSION=\"0.1.0\"

[env:esp32c5_4mb]
; Official PlatformIO 7.0.1 does not yet select the RISC-V toolchain for C5.
; This pinned PlatformIO-compatible fork supplies ESP-IDF 5.5.4 and C5 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = generic_esp32c5_4mb
board_build.partitions = partitions_4mb.csv
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig_4mb.defaults"
build_flags =
    ${env.build_flags}
    -DBC250_OTA_ENABLED=0

[env:esp32c5_8mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = generic_esp32c5_8mb
board_build.partitions = partitions_8mb.csv
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig_8mb.defaults"
build_flags =
    ${env.build_flags}
    -DBC250_OTA_ENABLED=1

[env:esp32c6_4mb]
board = generic_esp32c6_4mb
board_build.partitions = partitions_4mb.csv
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig_4mb.defaults"
build_flags =
    ${env.build_flags}
    -DBC250_OTA_ENABLED=0

[env:esp32c6_8mb]
board = generic_esp32c6_8mb
board_build.partitions = partitions_8mb.csv
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig_8mb.defaults"
build_flags =
    ${env.build_flags}
    -DBC250_OTA_ENABLED=1

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
    +<core/ble_match.c>
    +<core/button_logic.c>
    +<core/power_logic.c>
    +<core/presence_logic.c>
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
