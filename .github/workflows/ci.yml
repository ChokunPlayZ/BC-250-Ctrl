name: firmware

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19
      - run: pio test -e native

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32c5_4mb
          - esp32c5_8mb
          - esp32c6_4mb
          - esp32c6_8mb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.19
      - run: pio run -e ${{ matrix.environment }}
      - run: python tools/check_image_size.py partitions_${{ contains(matrix.environment, '8mb') && '8mb' || '4mb' }}.csv .pio/build/${{ matrix.environment }}/firmware.bin
