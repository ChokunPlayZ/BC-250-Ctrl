name: firmware

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'CMakeLists.txt'
      - 'partitions*.csv'
      - 'sdkconfig*.defaults'
      - 'src/**'
      - 'recovery/**'
      - 'test/native/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'CMakeLists.txt'
      - 'partitions*.csv'
      - 'sdkconfig*.defaults'
      - 'src/**'
      - 'recovery/**'
      - 'test/native/**'
      - 'tools/**'

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test/native -B build/host
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: esp32_4mb
            target: esp32
            idf: v6.1
            partitions: partitions_4mb.csv
          - profile: esp32s3_4mb
            target: esp32s3
            idf: v6.1
            partitions: partitions_4mb.csv
          - profile: esp32c3_4mb
            target: esp32c3
            idf: v5.5.4
            partitions: partitions_4mb.csv
          - profile: esp32c5_4mb
            target: esp32c5
            idf: v5.5.4
            partitions: partitions_4mb.csv
          - profile: esp32c5_8mb
            target: esp32c5
            idf: v5.5.4
            partitions: partitions_8mb.csv
          - profile: esp32c6_4mb
            target: esp32c6
            idf: v6.0.1
            partitions: partitions_4mb.csv
          - profile: esp32c6_8mb
            target: esp32c6
            idf: v6.0.1
            partitions: partitions_8mb.csv
          - profile: esp32c61_4mb
            target: esp32c61
            idf: v5.5.4
            partitions: partitions_4mb.csv
          - profile: esp32h2_4mb
            target: esp32h2
            idf: v5.5.4
            partitions: partitions_4mb.csv
          - profile: esp32h21_4mb
            target: esp32h21
            idf: v6.1
            partitions: partitions_4mb.csv
          - profile: esp32h4_4mb
            target: esp32h4
            idf: v6.1
            partitions: partitions_4mb.csv
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.profile }} with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: .
          command: python tools/idf_build.py ${{ matrix.profile }} build
      - run: python tools/check_image_size.py ${{ matrix.partitions }} build/${{ matrix.profile }}/bc250_ctrl.bin
      - name: Build C5 recovery image
        if: matrix.target == 'esp32c5'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: .
          command: python tools/idf_build.py ${{ matrix.profile }}_recovery build merge-bin -o bc250_recovery-full.bin
      - name: Check recovery image size
        if: matrix.target == 'esp32c5'
        run: python tools/check_image_size.py ${{ matrix.partitions }} build/${{ matrix.profile }}_recovery/bc250_recovery.bin
      - name: Upload C5 recovery image
        if: matrix.target == 'esp32c5'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}_recovery
          path: build/${{ matrix.profile }}_recovery/bc250_recovery-full.bin
